name: Keep Supabase Alive

on:
  schedule:
    # 每3天 UTC 02:00（北京时间 10:00）执行一次
    - cron: '0 2 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          # 直接请求 Supabase REST API（不经过网页，网页是 SPA 需要 JS 才会触发请求）
          # anon key 是前端公开的 publishable key，无泄露风险
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: sb_publishable_GgfQWLhZMCdEr38d901IFw_el68omgl" \
            -H "Authorization: Bearer sb_publishable_GgfQWLhZMCdEr38d901IFw_el68omgl" \
            "https://qqyszpjrlznvapfepiyy.supabase.co/rest/v1/anime_items?select=id&limit=1")
          echo "HTTP status: $response"
          if [ "$response" = "200" ] || [ "$response" = "206" ]; then
            echo "Supabase API 请求成功，项目保持活跃。"
          else
            echo "Supabase 返回 $response，项目可能已暂停或出错，请检查。"
          fi
