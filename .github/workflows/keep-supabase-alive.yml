name: Keep Supabase Alive

on:
  schedule:
    # 每3天 UTC 02:00（北京时间 10:00）执行一次
    - cron: '0 2 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping website
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://anime-notebook.pages.dev)
          echo "HTTP status: $response"
          if [ "$response" = "200" ]; then
            echo "Website is alive, Supabase will not be paused."
          else
            echo "Website returned non-200 status, check if deployment is healthy."
          fi
