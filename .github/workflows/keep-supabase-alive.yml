name: Keep Supabase Alive

on:
  schedule:
    # 每6小时执行一次（每天4次，即 UTC 0/6/12/18 点）
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          # anon key 是前端公开的 publishable key，无泄露风险
          # 末尾 || true：GitHub Actions 默认 bash -e 模式，curl 连接失败会返回
          # 非零退出码导致 job 被判失败并发邮件，|| true 确保任何情况都不告警
          response=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -H "apikey: sb_publishable_GgfQWLhZMCdEr38d901IFw_el68omgl" \
            -H "Authorization: Bearer sb_publishable_GgfQWLhZMCdEr38d901IFw_el68omgl" \
            "https://qqyszpjrlznvapfepiyy.supabase.co/rest/v1/anime_items?select=id&limit=1" || true)
          echo "HTTP status: $response"
